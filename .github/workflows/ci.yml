name: CI

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows x64, macOS arm64, macOS x64 (Intel runners until ~Aug 2027), Linux x64 — docs/08-testing.md §4
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - name: Test
        run: dotnet test -c ${{ matrix.config }}
      - name: Float ban
        if: matrix.config == 'Debug'
        shell: bash
        run: tools/ci/check-float-ban.sh
      - name: Hashes
        shell: bash
        run: dotnet run --project src/Rebuild.Tools -c ${{ matrix.config }} --no-build -- hashes tests/golden > hashes-${{ matrix.os }}-${{ matrix.config }}.txt
      - uses: actions/upload-artifact@v6
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.config }}
          path: hashes-${{ matrix.os }}-${{ matrix.config }}.txt

  cross-os-hashes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: hashes-*
          merge-multiple: true
          path: hashes
      - name: Compare all runners against tests/golden/hashes.txt
        run: tools/ci/compare-hashes.sh tests/golden/hashes.txt hashes/*.txt

  golden-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Golden changes need a version bump
        run: tools/ci/check-golden-version.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
